<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake.IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>Snake.IA</h1>

        <div class="hud">
            <span>Toi : <strong id="score">0</strong></span>
            <span id="rival-hud">IA : <strong id="rival-score" class="rival">0</strong></span>
            <span>Niveau : <strong id="level">1</strong></span>
            <span>Record : <strong id="best">0</strong></span>
        </div>

        <div class="board">
            <div id="map"></div>
            <div id="overlay" class="overlay">
                <p id="overlay-title">Snake.IA</p>
                <p id="overlay-text">Appuie sur Espace ou Démarrer</p>
                <div id="difficulty" class="difficulty">
                    <button data-level="off">Sans IA</button>
                    <button data-level="easy">Facile</button>
                    <button data-level="normal">Normal</button>
                    <button data-level="hard">Difficile</button>
                </div>
                <button id="start-btn">Démarrer</button>
            </div>
        </div>

        <div class="controls">
            <button data-dir="up" class="up">▲</button>
            <button data-dir="left" class="left">◀</button>
            <button id="pause-btn" class="pause">❚❚</button>
            <button data-dir="right" class="right">▶</button>
            <button data-dir="down" class="down">▼</button>
        </div>

        <p class="help">Flèches / ZQSD pour bouger · Espace pour pause · Glisse sur mobile</p>
    </main>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
